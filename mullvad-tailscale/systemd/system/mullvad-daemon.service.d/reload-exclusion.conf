# Drop-in for /usr/lib/systemd/system/mullvad-daemon.service (Mullvad package).
# Re-applies the priority-5200 LAN-bypass ip rule after every Mullvad start/
# restart — Mullvad flushes the rule table on connect and disconnect, which
# would otherwise wipe our 5200 rule. Re-apply is a no-op if the rule is
# already present (apply-lan-bypass.sh is idempotent).
#
# Why `ExecStartPost=` and not `ExecReloadPost=`: Mullvad does not call
# daemon-reload on connect/disconnect; the daemon internally rewrites the
# rule table via rtnetlink without restarting itself. So ExecStartPost
# fires only on the package's own start (boot, manual restart, drop-in
# triggering restart). It does NOT fire on every connect/disconnect churn.
#
# That gap is filled by the safety-net timer in
# mullvad-tailscale.timer — see /etc/systemd/system/mullvad-tailscale.timer.
[Unit]
# No unit-level directives needed.

[Service]
ExecStartPost=/usr/local/lib/mullvad-tailscale/apply-lan-bypass.sh
