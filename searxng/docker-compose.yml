# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-2026.4.10-7737a0da1}
    # 2026-09-04: run as nero (uid/gid 1000). Durable fix for the ownership
    # cycle — root-run container re-claimed core-config/ to its runtime uid
    # (977/systemd-network) on every restart, breaking git ops on the repo.
    # Validated on test boot: uid 1000 parses config, serves JSON, and the
    # bind-mounted settings.yml stays nero-owned after boot.
    user: "1000:1000"
    restart: always
    network_mode: host
    ports:
      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
